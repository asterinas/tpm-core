[package]
name = "tpm-core"
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
description = "TPM 2.0 core transport/session library with verification-oriented design."
repository = "https://github.com/asterinas/tpm-core"
homepage = "https://github.com/asterinas/tpm-core"
documentation = "https://docs.rs/tpm-core"
readme = "README.md"
keywords = ["tpm", "tpm2", "security", "kernel", "no-std"]
categories = ["embedded", "cryptography", "no-std"]
exclude = ["target/*", ".git/*"]

[features]
default = ["runtime"]
runtime = []

[dependencies]
[package.metadata.docs.rs]
features = ["runtime"]